[project]
name = "rotavix-pipeline"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "pmtiles>=3.8", "httpx>=0.27", "osmium>=4.0", "holidays>=0.60"]

[project.scripts]
rotavix-pipeline = "rotavix_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rotavix_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
