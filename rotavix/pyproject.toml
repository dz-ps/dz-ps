[project]
name = "rotavix-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "pipeline"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.15", "pyright>=1.1.400"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["apps/api/rotavix_api", "pipeline/rotavix_pipeline"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
