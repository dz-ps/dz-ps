[project]
name = "rotavix-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rotavix_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
